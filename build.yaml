changelog: >
  0.10.0: Category folders (rules 'Name: KEY1, KEY2' group the VOD and Series categories, tags removed from their names); 'FR - Title' language prefixes become tags. Prefetch task (nightly and at startup) loads the selected categories into the cache, now fresh for 24 hours. Guide refresh protected: channels without a guide id are skipped, guide paused after 5 failures in a row, 15 s timeout. All queries paused for 10 minutes when the provider refuses one (401, 403, 429, 444, connection refused) instead of retrying. Live channels without a name no longer abort the channel list. 0.9.x: Jellyfin 12.3 support, playback fix (media sources carry the item identifier), resilient queries with a memory and disk cache, custom folder names.
