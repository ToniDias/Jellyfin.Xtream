changelog: >
  Jellyfin 12.3 support (.NET 10). Fix playback of series, movies and catch-up under Jellyfin 12: their media sources now carry the identifier of the item (Jellyfin 12 drops unknown GUIDs and needs a GUID to stream); items saved by older versions are updated once. Retry empty or failed provider answers and serve the last usable one from a memory and disk cache. Custom names for the Video On-Demand, Series and Catch-up folders.
